<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modificar atributos HTML</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>Curso de JavaScript: interacciones con HTML</h1>
  </header>

  <nav id="menu"></nav>

  <main>
    <h2>Modificar atributos HTML</h2>
    <p>JavaScript puede cambiar el valor de los atributos de un elemento,
       como el atributo <code>src</code> de una imagen.</p>

    <div class="ejemplo">
      <h3>¿Qué puede hacer JavaScript?</h3>
      <button type="button" onclick="document.getElementById('bombilla').src='https://www.w3schools.com/js/pic_bulbon.gif'">Encender</button>
      <br>
      <img id="bombilla" src="https://www.w3schools.com/js/pic_bulboff.gif" alt="Bombilla" style="width:100px; margin-top:10px;">
      <br>
      <button type="button" onclick="document.getElementById('bombilla').src='https://www.w3schools.com/js/pic_bulboff.gif'">Apagar</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Curso JavaScript - Formación para empresas</p>
  </footer>

  <script src="js/menu.js"></script>
</body>
</html>
